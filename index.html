<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boat route map</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 2 C31 11 33 22 32 40 Q32 44 29 44 L19 44 Q16 44 16 40 C15 22 17 11 24 2 Z' fill='%23d6246e'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="app">
      <aside class="panel" id="panel" aria-label="Route settings"></aside>
      <main class="stage-area" id="area">
        <div class="stage" id="stage"><div id="map"></div></div>
        <div class="toolbar" id="toolbar"></div>
        <div class="playbar" id="playbar"></div>
        <div class="welcome" id="welcome" role="dialog" aria-label="Welcome" hidden></div>
        <div class="clean-hint" id="clean-hint" role="status" hidden></div>
        <div class="preload" id="preload" hidden></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
